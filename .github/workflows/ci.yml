name: CI with different Java versions

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-18.04
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-java@v5
      with:
        java-version: '8'
        distribution: 'temurin'
    - name: Build and Test
      run: mvn verify
