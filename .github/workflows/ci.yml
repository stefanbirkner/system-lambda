name: CI with different Java versions

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-slim
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-java@v5
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
    - name: Build and Test
      run: mvn verify pom.xml
