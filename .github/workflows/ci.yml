name: CI with different Java versions

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      matrix:
        java: [8, 11, 17]

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v3
      with:
        java-version: ${{ matrix.java }}
        distribution: temurin
        cache: maven
    - name: Build and Test
      run: ./mvnw verify -Dgpg.skip
